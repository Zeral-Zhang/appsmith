name: PG Client Subtree Split from Upstream

on:
  schedule:
    - cron: '0 22 * * *'  # Runs at 10 PM UTC (6 AM Beijing Time)
  workflow_dispatch:  # Allows manual execution

jobs:
  split-subtree:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          ref: pg  # Ensures the workflow always runs in the `pg` branch
          fetch-depth: 0  # Fetch entire history to ensure correct subtree operations

      - name: Set up Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Add upstream repository
        run: |
          git remote add upstream https://github.com/appsmithorg/appsmith.git
          git fetch upstream pg

      - name: Sync upstream changes into local pg branch
        run: |
          git checkout pg
          git merge --ff-only upstream/pg || { echo "Merge failed. Exiting."; exit 1; }
          git push origin pg  # Ensure local pg is updated

      - name: Check for new commits after merge
        id: check_changes
        run: |
          LOCAL_COMMIT=$(git rev-parse origin/pg)
          UPSTREAM_COMMIT=$(git rev-parse upstream/pg)
          if [ "$LOCAL_COMMIT" != "$UPSTREAM_COMMIT" ]; then
            echo "New changes detected. Proceeding with subtree split."
            echo "split_needed=true" >> $GITHUB_ENV
          else
            echo "No new changes. Exiting."
            echo "split_needed=false" >> $GITHUB_ENV
            exit 0
          fi

      - name: Fetch pg-client branch (if exists)
        run: |
          git fetch origin pg-client || echo "pg-client branch does not exist, will create a new one"

      - name: Perform subtree split only for new commits
        if: env.split_needed == 'true'
        run: |
          # Generate the latest commit range
          LAST_SPLIT_COMMIT=$(git log --pretty=format:"%H" -n 1 origin/pg-client -- app/client || echo "")
          if [ -z "$LAST_SPLIT_COMMIT" ]; then
            echo "No previous split found, performing full subtree split."
            git subtree split --prefix=app/client -b pg-client --rejoin
          else
            echo "Performing subtree split for new commits only."
            git subtree split --prefix=app/client --onto origin/pg-client pg -b pg-client --rejoin
          fi

      - name: Push the updated pg-client branch
        run: |
          git push origin pg-client --force
